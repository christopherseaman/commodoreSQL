version: '3.8'

services:
  duckdb-server:
    image: ghcr.io/motherduckdb/motherduck-duckdb-server:latest
    volumes:
      - .:/data
    ports:
      - "3457:3457"
    command: ["--database", "/data/commodore.db", "--http-port", "3457"]
  
  metabase:
    image: metabase/metabase:latest
    ports:
      - "3000:3000"
    environment:
      - MB_DB_TYPE=h2
      - MB_DB_FILE=/metabase-data/metabase.db
    volumes:
      - metabase-data:/metabase-data
    depends_on:
      - duckdb-server

volumes:
  metabase-data:
